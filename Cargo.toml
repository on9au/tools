[workspace]
resolver = "3"
members = [
	"crates/tool/tool-core",
	"crates/tool/toolctl",
	"crates/tool/tool-installer",
	"crates/package-definitions/pdupload",
	"crates/migration/upstream-migration-planner",
	"crates/fs/reaper",
]

[workspace.package]
edition = "2024"
authors = ["on9au <151502370+on9au@users.noreply.github.com>"]
license = "MIT"

[workspace.dependencies]
tool-core = { path = "crates/tool/tool-core" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
comfy-table = "7.1"
dialoguer = "0.11"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.16"
time = { version = "0.3", features = ["formatting", "macros"] }
toml = "0.8"
walkdir = "2.5"
xmltree = "0.11"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
windows = "0.62"
